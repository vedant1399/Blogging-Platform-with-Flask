{% extends 'base.html' %}

{% block title %}Register - Blogging Platform{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200 mt-6">
    <div class="text-center mb-6">
        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 font-bold text-xl">
            ✨
        </div>
        <h2 class="text-2xl font-extrabold text-slate-900">Create an author account</h2>
        <p class="text-xs text-slate-500 mt-1">Register as an author with secure password hashing</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
            <input type="text" name="username" value="{{ username if username else '' }}" required placeholder="e.g. vedant" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
            <input type="email" name="email" value="{{ email if email else '' }}" required placeholder="e.g. vedant@example.com" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
            <input type="password" name="password" required placeholder="Minimum 6 characters" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Confirm Password</label>
            <input type="password" name="confirm_password" required placeholder="Repeat your password" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg text-sm transition shadow-sm">
            Complete Registration
        </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-500 border-t border-slate-100 pt-4">
        Already have an account? 
        <a href="{{ url_for('auth.login') }}" class="font-semibold text-indigo-600 hover:text-indigo-500">
            Sign in
        </a>
    </div>
</div>
{% endblock %}
