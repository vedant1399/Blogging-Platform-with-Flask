{% extends 'base.html' %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-10 rounded-3xl shadow-sm border border-slate-200 text-center space-y-4 my-12">
    <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-2xl font-extrabold">
        404
    </div>
    <h1 class="text-2xl font-extrabold text-slate-900">Page Not Found</h1>
    <p class="text-xs text-slate-500 leading-relaxed">
        The article or page you are looking for doesn't exist, has been moved, or is temporarily unavailable.
    </p>
    <div class="pt-3">
        <a href="{{ url_for('main.index') }}" class="inline-flex items-center bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-5 py-2.5 rounded-xl transition shadow-sm">
            ← Return to Home
        </a>
    </div>
</div>
{% endblock %}
